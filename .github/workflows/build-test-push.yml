name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lily-discord-adapter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Python syntax
        run: docker run --rm lily-discord-adapter:ci python -m compileall -q .

      - name: Run tests
        run: docker run --rm lily-discord-adapter:ci pytest tests/ -v

      - name: Run container health check
        run: |
          set -euo pipefail
          docker run -d --rm --name discord-adapter-test \
            -p 127.0.0.1:8004:8004 \
            lily-discord-adapter:ci

          cleanup() {
            docker rm -f discord-adapter-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8004/health >/dev/null; then
              echo 'Health check passed.'
              exit 0
            fi
            sleep 1
          done

          echo 'Health check failed.' >&2
          docker logs discord-adapter-test >&2 || true
          exit 1
