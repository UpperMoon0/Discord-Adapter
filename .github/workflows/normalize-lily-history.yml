name: One-off normalize Lily git identity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-lily-history.yml

permissions:
  contents: write

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite incorrect Lily identity trailers
        shell: bash
        env:
          EXPECTED_REMOTE_TIP: ${{ github.sha }}
        run: |
          set -euo pipefail

          git checkout main
          before_tree="$(git rev-parse 'main^{tree}')"
          git log main --format='%B' > /tmp/messages.before
          git log main --format='%an <%ae>' > /tmp/authors.before

          stale_noreply_before="$(grep -Fc 'lily@users.noreply.github.com' /tmp/messages.before || true)"
          stale_local_before="$(grep -Fc 'lily@local.invalid' /tmp/messages.before || true)"
          lily_authors_before="$(grep -Fxc 'Lily <lily@nstut.cloud>' /tmp/authors.before || true)"

          test "$stale_noreply_before" -gt 0
          test "$lily_authors_before" -gt 0

          cat > /tmp/rewrite_message.py <<'PY'
          import sys

          message = sys.stdin.read()
          message = message.replace(
              "lily@users.noreply.github.com",
              "lily@nstut.cloud",
          )
          message = message.replace(
              "lily@local.invalid",
              "lily@nstut.cloud",
          )
          sys.stdout.write(message)
          PY

          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f \
            --msg-filter 'python3 /tmp/rewrite_message.py' \
            -- main

          after_tree="$(git rev-parse 'main^{tree}')"
          test "$before_tree" = "$after_tree"

          git log main --format='%B' > /tmp/messages.after
          git log main --format='%an <%ae>' > /tmp/authors.after

          if grep -Fq 'lily@users.noreply.github.com' /tmp/messages.after; then
            echo 'stale GitHub noreply Lily identity is still reachable from main' >&2
            exit 1
          fi

          if grep -Fq 'lily@local.invalid' /tmp/messages.after; then
            echo 'stale local.invalid Lily identity is still reachable from main' >&2
            exit 1
          fi

          lily_authors_after="$(grep -Fxc 'Lily <lily@nstut.cloud>' /tmp/authors.after || true)"
          test "$lily_authors_before" = "$lily_authors_after"

          git push origin refs/heads/main:refs/heads/main \
            --force-with-lease="refs/heads/main:${EXPECTED_REMOTE_TIP}"
