name: One-off normalize Lily git identity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-lily-history.yml

permissions:
  contents: write

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Lily author, committer, and co-author email
        shell: bash
        env:
          EXPECTED_REMOTE_TIP: ${{ github.sha }}
        run: |
          set -euo pipefail

          git checkout main
          before_tree="$(git rev-parse 'main^{tree}')"
          git log main --format='%B' > /tmp/messages.before
          git log main --format='%an <%ae>%n%cn <%ce>' > /tmp/identities.before

          old_lily_identity_before="$(grep -Fxc 'Lily <lily@nstut.com>' /tmp/identities.before || true)"
          test "$old_lily_identity_before" -gt 0

          cat > /tmp/rewrite_message.py <<'PY'
          import sys

          message = sys.stdin.read()
          for old in (
              "lily@users.noreply.github.com",
              "lily@local.invalid",
              "lily@nstut.com",
          ):
              message = message.replace(old, "lily@nstut.cloud")
          sys.stdout.write(message)
          PY

          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f \
            --env-filter '
              if [ "$GIT_AUTHOR_NAME" = "Lily" ]; then
                case "$GIT_AUTHOR_EMAIL" in
                  lily@users.noreply.github.com|lily@local.invalid|lily@nstut.com)
                    GIT_AUTHOR_EMAIL="lily@nstut.cloud"
                    ;;
                esac
              fi
              if [ "$GIT_COMMITTER_NAME" = "Lily" ]; then
                case "$GIT_COMMITTER_EMAIL" in
                  lily@users.noreply.github.com|lily@local.invalid|lily@nstut.com)
                    GIT_COMMITTER_EMAIL="lily@nstut.cloud"
                    ;;
                esac
              fi
              export GIT_AUTHOR_EMAIL GIT_COMMITTER_EMAIL
            ' \
            --msg-filter 'python3 /tmp/rewrite_message.py' \
            -- main

          after_tree="$(git rev-parse 'main^{tree}')"
          test "$before_tree" = "$after_tree"

          git log main --format='%B' > /tmp/messages.after
          git log main --format='%an <%ae>%n%cn <%ce>' > /tmp/identities.after

          for stale in \
            'lily@users.noreply.github.com' \
            'lily@local.invalid' \
            'lily@nstut.com'; do
            if grep -Fq "$stale" /tmp/messages.after /tmp/identities.after; then
              echo "stale Lily identity remains reachable from main: $stale" >&2
              exit 1
            fi
          done

          grep -Fqx 'Lily <lily@nstut.cloud>' /tmp/identities.after

          git push origin refs/heads/main:refs/heads/main \
            --force-with-lease="refs/heads/main:${EXPECTED_REMOTE_TIP}"
